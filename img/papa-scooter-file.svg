<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-label="Almirah ke saamne baitha beta, purani file mein cancelled car booking aur Papa ki diary">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A4356"/>
      <stop offset="1" stop-color="#3A2C44"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD98A"/>
      <stop offset="1" stop-color="#FF9E5E"/>
    </linearGradient>
  </defs>
  <rect width="1536" height="1024" fill="url(#room)"/>
  <!-- evening window -->
  <rect x="1150" y="120" width="260" height="330" rx="14" fill="url(#win)"/>
  <rect x="1150" y="278" width="260" height="14" fill="#3A2C44"/>
  <rect x="1272" y="120" width="14" height="330" fill="#3A2C44"/>
  <circle cx="1220" cy="230" r="34" fill="#FFF3DC" opacity="0.9"/>
  <path d="M 1160 440 L 1400 440 L 1330 620 L 1230 620 Z" fill="#FFC98B" opacity="0.14"/>
  <!-- almirah -->
  <g>
    <rect x="180" y="120" width="420" height="700" rx="16" fill="#2B2440"/>
    <rect x="205" y="150" width="175" height="640" rx="10" fill="#4A3A56"/>
    <rect x="395" y="150" width="180" height="330" rx="10" fill="#4A3A56"/>
    <rect x="395" y="500" width="180" height="290" rx="10" fill="#241D36"/>
    <circle cx="368" cy="470" r="9" fill="#FFC98B"/>
    <circle cx="412" cy="470" r="9" fill="#FFC98B"/>
    <rect x="228" y="200" width="130" height="26" rx="6" fill="#8A6E52"/>
    <rect x="228" y="240" width="130" height="26" rx="6" fill="#A08060"/>
    <rect x="228" y="280" width="130" height="26" rx="6" fill="#8A6E52"/>
    <rect x="420" y="200" width="130" height="20" rx="6" fill="#A08060"/>
    <rect x="420" y="232" width="130" height="20" rx="6" fill="#8A6E52"/>
  </g>
  <!-- floor -->
  <rect x="0" y="820" width="1536" height="204" fill="#241D36"/>
  <!-- scattered papers -->
  <g>
    <rect x="640" y="700" width="200" height="140" rx="8" fill="#F5E9D4" transform="rotate(-7 740 770)"/>
    <rect x="672" y="726" width="130" height="10" rx="5" fill="#B9A88C" transform="rotate(-7 740 770)"/>
    <rect x="672" y="748" width="150" height="10" rx="5" fill="#B9A88C" transform="rotate(-7 740 770)"/>
    <rect x="860" y="730" width="190" height="130" rx="8" fill="#EFE3CC" transform="rotate(5 950 790)"/>
    <rect x="888" y="756" width="120" height="10" rx="5" fill="#B9A88C" transform="rotate(5 950 790)"/>
    <rect x="888" y="778" width="140" height="10" rx="5" fill="#B9A88C" transform="rotate(5 950 790)"/>
  </g>
  <!-- the receipt with car, crossed out -->
  <g transform="rotate(-3 1180 800)">
    <rect x="1060" y="690" width="260" height="190" rx="10" fill="#FFF6E5"/>
    <rect x="1090" y="716" width="180" height="12" rx="6" fill="#C9B896"/>
    <g fill="#5A4668">
      <path d="M 1100 800 Q 1108 768 1140 764 L 1216 760 Q 1252 762 1262 792 L 1272 800 Q 1282 802 1282 812 L 1282 822 Q 1282 830 1272 830 L 1266 830 A 18 18 0 0 1 1230 828 L 1150 828 A 18 18 0 0 1 1114 826 L 1102 826 Q 1092 826 1092 814 Z"/>
    </g>
    <circle cx="1132" cy="830" r="14" fill="#2B2440"/>
    <circle cx="1248" cy="830" r="14" fill="#2B2440"/>
    <line x1="1082" y1="856" x2="1298" y2="742" stroke="#D64545" stroke-width="14" stroke-linecap="round"/>
    <line x1="1082" y1="742" x2="1298" y2="856" stroke="#D64545" stroke-width="14" stroke-linecap="round"/>
  </g>
  <!-- diary -->
  <g transform="rotate(4 720 900)">
    <rect x="620" y="860" width="200" height="80" rx="10" fill="#8A3B3B"/>
    <rect x="620" y="860" width="26" height="80" rx="8" fill="#6E2E2E"/>
    <rect x="700" y="884" width="90" height="10" rx="5" fill="#E8C9A8" opacity="0.8"/>
    <rect x="700" y="904" width="70" height="10" rx="5" fill="#E8C9A8" opacity="0.55"/>
  </g>
  <!-- boy sitting on floor, from behind -->
  <g fill="#181226">
    <circle cx="900" cy="560" r="46"/>
    <path d="M 820 850 Q 810 640 900 620 Q 990 640 980 850 Z"/>
    <path d="M 836 690 Q 790 740 812 812" stroke="#181226" stroke-width="24" fill="none" stroke-linecap="round"/>
    <path d="M 964 690 Q 1010 740 988 812" stroke="#181226" stroke-width="24" fill="none" stroke-linecap="round"/>
    <ellipse cx="900" cy="856" rx="150" ry="20"/>
  </g>
</svg>
