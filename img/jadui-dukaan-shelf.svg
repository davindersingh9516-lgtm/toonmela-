      <circle cx="790" cy="462" r="17"/>
      <line x1="769" y1="462" x2="773" y2="462"/>
    </g>
  </g>
  <!-- floor -->
  <rect x="0" y="880" width="1536" height="144" fill="#181430"/>
</svg>
