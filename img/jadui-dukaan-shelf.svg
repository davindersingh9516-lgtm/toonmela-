<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-label="Jadui dukaan ke andar shelf pe khoyi hui cheezein - patang, kanche, jar mein band awaazein">
  <defs>
    <linearGradient id="inside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241D44"/>
      <stop offset="1" stop-color="#3B2E5A"/>
    </linearGradient>
    <radialGradient id="lamplight" cx="0.5" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#FFC55C" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#FFC55C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1536" height="1024" fill="url(#inside)"/>
  <ellipse cx="768" cy="360" rx="700" ry="420" fill="url(#lamplight)"/>
  <!-- hanging lantern -->
  <line x1="768" y1="0" x2="768" y2="120" stroke="#141227" stroke-width="8"/>
  <ellipse cx="768" cy="160" rx="34" ry="44" fill="#FFC55C"/>
  <circle cx="768" cy="160" r="14" fill="#FFF3DC"/>
  <!-- shelf unit left -->
