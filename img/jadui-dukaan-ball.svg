<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" aria-label="Shaam ko aangan mein Veer bowling karta hua aur Dadaji bat ke saath - khushi ka scene">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD3A8"/>
      <stop offset="0.55" stop-color="#FF9E7A"/>
      <stop offset="1" stop-color="#E86A6A"/>
    </linearGradient>
  </defs>
  <rect width="1536" height="1024" fill="url(#dusk)"/>
  <circle cx="768" cy="520" r="240" fill="#FFE3A8" opacity="0.45"/>
  <circle cx="768" cy="520" r="150" fill="#FFEDC2"/>
  <path d="M 300 180 q 13 -15 26 0 q 13 -15 26 0" stroke="#8A4A5A" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 1180 150 q 12 -14 24 0 q 12 -14 24 0" stroke="#8A4A5A" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- courtyard wall -->
  <rect x="0" y="560" width="1536" height="120" fill="#8A4A5A" opacity="0.5"/>
  <rect x="0" y="548" width="1536" height="20" fill="#6E3A4A" opacity="0.5"/>
  <!-- tree left -->
  <g opacity="0.75">
    <rect x="140" y="430" width="34" height="260" rx="14" fill="#4A2E3E"/>
    <circle cx="158" cy="360" r="105" fill="#5A7A5A"/>
    <circle cx="90" cy="420" r="70" fill="#5A7A5A"/>
    <circle cx="230" cy="416" r="76" fill="#5A7A5A"/>
  </g>
  <!-- house corner right -->
  <g opacity="0.6" fill="#6E3A4A">
    <rect x="1300" y="380" width="236" height="300"/>
    <path d="M 1280 380 L 1420 290 L 1536 366 L 1536 380 Z"/>
    <rect x="1350" y="440" width="60" height="76" fill="#FFD3A8"/>
  </g>
  <!-- ground -->
  <rect x="0" y="660" width="1536" height="364" fill="#3B2440"/>
  <ellipse cx="768" cy="672" rx="700" ry="18" fill="#2B1A33"/>
  <!-- stumps -->
  <g stroke="#F5E9D4" stroke-width="14" stroke-linecap="round">
    <line x1="1120" y1="760" x2="1114" y2="890"/>
    <line x1="1160" y1="756" x2="1160" y2="888"/>
    <line x1="1200" y1="760" x2="1206" y2="890"/>
  </g>
  <line x1="1118" y1="752" x2="1204" y2="752" stroke="#FFC55C" stroke-width="10" stroke-linecap="round"/>
  <!-- Veer bowling, left -->
  <g fill="#1B1226">
    <circle cx="430" cy="560" r="32"/>
    <path d="M 400 730 Q 392 620 436 596 Q 480 578 488 616 Q 490 660 458 726 Z"/>
    <path d="M 452 610 Q 490 540 540 508" stroke="#1B1226" stroke-width="17" fill="none" stroke-linecap="round"/>
    <path d="M 412 640 L 356 690" stroke="#1B1226" stroke-width="16" stroke-linecap="round"/>
    <path d="M 420 726 L 380 850" stroke="#1B1226" stroke-width="19" stroke-linecap="round"/>
    <path d="M 452 726 L 500 844" stroke="#1B1226" stroke-width="19" stroke-linecap="round"/>
  </g>
  <!-- the red ball, mid-air with spin trail -->
  <circle cx="640" cy="440" r="26" fill="#D64545"/>
  <path d="M 560 470 q 30 -24 56 -18" stroke="#FFF3DC" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M 528 500 q 24 -20 44 -16" stroke="#FFF3DC" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.5"/>
  <!-- Dadaji batting, right -->
  <g fill="#1B1226">
    <circle cx="1020" cy="540" r="34"/>
    <path d="M 986 730 Q 976 606 1022 582 Q 1068 564 1074 606 Q 1076 660 1046 726 Z"/>
    <path d="M 1048 600 L 1104 560" stroke="#1B1226" stroke-width="16" stroke-linecap="round"/>
    <path d="M 1000 640 L 952 674" stroke="#1B1226" stroke-width="15" stroke-linecap="round"/>
    <path d="M 1000 726 L 972 852" stroke="#1B1226" stroke-width="19" stroke-linecap="round"/>
    <path d="M 1040 726 L 1072 850" stroke="#1B1226" stroke-width="19" stroke-linecap="round"/>
  </g>
  <path d="M 1046 514 Q 1058 508 1064 520 Q 1054 528 1046 524 Z" fill="#F5E9D4"/>
  <!-- bat -->
  <g transform="rotate(-38 1116 552)">
    <rect x="1104" y="470" width="26" height="60" rx="10" fill="#8A5A3A"/>
    <rect x="1094" y="524" width="46" height="130" rx="18" fill="#C9986A"/>
  </g>
  <!-- shadows and joy sparkles -->
  <ellipse cx="430" cy="864" rx="130" ry="14" fill="#241730" opacity="0.7"/>
  <ellipse cx="1020" cy="864" rx="130" ry="14" fill="#241730" opacity="0.7"/>
  <path d="M 700 320 l 6 14 14 6 -14 6 -6 14 -6 -14 -14 -6 14 -6 Z" fill="#FFF3DC" opacity="0.9"/>
  <path d="M 880 280 l 5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 Z" fill="#FFF3DC" opacity="0.7"/>
</svg>
